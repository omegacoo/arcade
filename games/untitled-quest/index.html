<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Untitled Quest - Ben's Arcade</title>
  <link rel="stylesheet" href="../../css/site.css?v=2">
  <style>
    .cabinet { max-width: 768px; }
    .cabinet canvas { image-rendering: pixelated; cursor: default; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../../">&larr; Back to Ben's Arcade</a>
    <div class="cabinet">
      <div class="hud"><span>UNTITLED QUEST</span></div>
      <canvas id="game" width="256" height="224"></canvas>
      <p class="hint">Arrow keys or WASD to move the cursor, Enter / Z / Space to confirm, Esc / X to go back, M to mute. In the overworld, hold the arrow keys / WASD or the mouse button to walk. You are the dark lord. Make the heroes regret coming.</p>
    </div>
  </div>
  <script src="game.js?v=3"></script>
</body>
</html>
