<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake - Ben's Arcade</title>
  <link rel="stylesheet" href="../../css/site.css">
</head>
<body>
  <div class="wrap">
    <a class="back" href="../../">&larr; Back to Ben's Arcade</a>
    <div class="cabinet">
      <div class="hud"><span>SNAKE</span><span>SCORE: <span id="score">0</span></span></div>
      <canvas id="game" width="400" height="400"></canvas>
      <p class="hint">Arrow keys / WASD to move, swipe on touch. Press Space or tap to start.</p>
    </div>
    <section class="scores">
      <h2>High Scores</h2>
      <ol id="scores"></ol>
    </section>
  </div>
  <script src="../../js/scores.js"></script>
  <script src="game.js"></script>
</body>
</html>
